[project]
name = "cwru-fault-detection"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "tqdm>=4.68.1",
    "xgboost>=3.3.0",
]

[tool.fastapi]
entrypoint = "src.backend.main:app"
